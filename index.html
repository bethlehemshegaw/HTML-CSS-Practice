<body>
    <h1> HTML FORMS</h1>

<form >
    <label for="username"> <p style="color: green">enter username</p></label>
    <input type="text" id="username" placeholder="bethlhem" required><br><br>
    <label for="email">enter email</label>
    <input type="email" id="email" placeholder="bethsusu@gmail.com" required><br><br>
    <label for="password"> password:</label>
    <input type="password" id="password" placeholder="12355@gdh" required>
    <p>select your age:</p>
    <input type="radio" name="age" value="0-25" id="option1">
    <label for="option1">0-25</label>
    <input type="radio" name="age" value="26-50" id="option2">
    <label for="option2">26-50</label>
    <input type="radio" name="age" value="50+" id="option3">

      <option value="q1">what color are your favorite pair of socks ?</option>

      <option value="q3">what is you birthday</option></select> <br><br>
      <label for="answer">Answer the question</label>
      <input type="text" name="answer" id="answer">
      <br><br>
      <label for="bio">your bio:</label><br>
      <textarea name="bio" id="bio" placeholder="about you..." ></textarea>
      <br><br>
      <input type="submit" name="submit" value="submit the form">
</form>
